name: build-and-publish

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
      DEB_S3_BUCKET: ${{ vars.DEB_S3_BUCKET }}
      DEB_S3_PREFIX: ${{ vars.DEB_S3_PREFIX }}
      DEB_S3_CODENAME: ${{ vars.DEB_S3_CODENAME }}
      DEB_S3_COMPONENT: ${{ vars.DEB_S3_COMPONENT }}
      DEB_S3_REGION: ${{ vars.DEB_S3_REGION }}
      DEB_S3_ENDPOINT: ${{ vars.DEB_S3_ENDPOINT }}
      DEB_S3_FORCE_PATH_STYLE: ${{ vars.DEB_S3_FORCE_PATH_STYLE }}
      DEB_S3_SIGN_KEY: ${{ vars.DEB_S3_SIGN_KEY }}
      DEB_S3_CLEAN: ${{ vars.DEB_S3_CLEAN }}
      DEB_S3_ORIGIN: ${{ vars.DEB_S3_ORIGIN }}
      DEB_S3_SUITE: ${{ vars.DEB_S3_SUITE }}
      DEB_S3_PRESERVE_VERSIONS: ${{ vars.DEB_S3_PRESERVE_VERSIONS }}
      DEB_S3_LOCK: ${{ vars.DEB_S3_LOCK }}
      DEB_S3_FAIL_IF_EXISTS: ${{ vars.DEB_S3_FAIL_IF_EXISTS }}
      DEB_S3_VISIBILITY: ${{ vars.DEB_S3_VISIBILITY }}
      DEB_REPO_SIGNING_PRIVATE_KEY: ${{ secrets.DEB_REPO_SIGNING_PRIVATE_KEY }}
      DEB_REPO_SIGNING_PASSPHRASE: ${{ secrets.DEB_REPO_SIGNING_PASSPHRASE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            debhelper \
            devscripts \
            dh-dkms \
            gnupg \
            ruby
          sudo gem install --no-document deb-s3

      - name: Build packages
        id: package
        run: |
          ./ci/build-package.sh \
            --artifact-dir "${RUNNER_TEMP}/artifacts" \
            --output-file "$GITHUB_OUTPUT"

      - name: Prepare repository signing key
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && env.DEB_REPO_SIGNING_PRIVATE_KEY != '' }}
        run: |
          ./ci/setup-repo-signing.sh \
            --env-file "$GITHUB_ENV" \
            --home "${RUNNER_TEMP}/deb-repo-signing" \
            --public-key-dir "${{ steps.package.outputs.artifact_dir }}/repository-signing-key"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}
          path: ${{ steps.package.outputs.artifact_dir }}/
          if-no-files-found: error

      - name: Publish to deb-s3
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && env.DEB_S3_BUCKET != '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' }}
        run: |
          ./ci/publish-deb-s3.sh \
            --artifact-dir "${{ steps.package.outputs.artifact_dir }}"
